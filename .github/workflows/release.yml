# Cova — release pipeline.
#
# Triggered by publishing a `v*` tag, or manually with an existing tag. Every
# published build is a beta, so the release is always a pre-release (PRD §26.2).
#
# Each target is built on a native GitHub-hosted runner rather than
# cross-compiled, so the packages are produced by the toolchain that ships with
# the platform they target:
#
#   ubuntu-24.04       x86_64 Linux   .deb .rpm pacman .tar.gz
#   ubuntu-24.04-arm   aarch64 Linux  .deb .rpm pacman .tar.gz
#   macos-15-intel     x86_64 Mach-O  feeds the universal build
#   macos-15           arm64 Mach-O   feeds the universal build
#   macos-15           universal     .pkg .dmg .tar.gz
#   windows-latest     x86_64 MinGW   .msi
#   windows-11-arm     arm64 WoA      .msi
#
# The Windows x86_64 build uses MSYS2's UCRT64 MinGW-w64 GCC; the Arm64 build
# uses the CLANGARM64 Clang because MSYS2 does not ship a native GCC for WoA.
# Cova does not support MSVC as a host toolchain yet (PRD §20.2 phase three), so
# both jobs build with a GNU-compatible toolchain and link the C++ runtime,
# libgcc and winpthreads statically.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0-beta-1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          # Ubuntu 24.04 defaults to GCC 13, which predates -std=c++26 and
          # <print>. GCC 14 is the oldest system compiler Cova supports.
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 rpm libarchive-tools zstd file

      - name: Select compiler
        run: |
          echo "COVA_CXX=g++-14" >> "$GITHUB_ENV"
          g++-14 --version | head -1

      - name: Build static release binary
        env:
          COVA_CXXFLAGS: -O2 -DNDEBUG -static
          COVA_LDFLAGS: -static
        run: python3 scripts/devbuild.py build -j "$(nproc)"

      - name: Test
        env:
          COVA_CXXFLAGS: -O2 -DNDEBUG -static
          COVA_LDFLAGS: -static
        run: python3 scripts/devbuild.py test -j "$(nproc)"

      - name: Strip
        run: strip build/bin/cova

      - name: Build packages
        env:
          COVA_BINARY: ${{ github.workspace }}/build/bin/cova
        run: |
          file build/bin/cova
          bash scripts/package/build-all.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install toolchain
        # GCC, not Apple Clang: the C++26 baseline Cova needs (<expected>,
        # <print>, concepts, ranges, designated initializers) is still ahead of
        # the Clang that ships with Xcode. The bootstrap probe is the authority.
        run: |
          brew install --quiet gcc ninja
          prefix="$(brew --prefix)"
          gxx="$(ls -1 "$prefix"/bin/g++-* 2>/dev/null | sort -V | tail -1)"
          [ -n "$gxx" ] || { echo "::error::Homebrew GCC not found"; exit 1; }
          echo "COVA_CXX=$gxx" >> "$GITHUB_ENV"
          "$gxx" --version | head -1

      - name: Build
        env:
          COVA_CXXFLAGS: -O2 -DNDEBUG
          COVA_LDFLAGS: -static-libstdc++ -static-libgcc
        run: python3 scripts/devbuild.py build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        env:
          COVA_CXXFLAGS: -O2 -DNDEBUG
          COVA_LDFLAGS: -static-libstdc++ -static-libgcc
        run: python3 scripts/devbuild.py test -j "$(sysctl -n hw.ncpu)"

      - name: Check runtime dependencies
        # A binary that still points at Homebrew's libstdc++ would not start on
        # a clean Mac, so fail here instead of shipping it.
        run: |
          otool -L build/bin/cova
          if otool -L build/bin/cova | grep -iE 'homebrew|/opt/local|/usr/local/opt'; then
            echo "::error::cova links a package-manager library path"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cova-macos-${{ matrix.arch }}
          path: build/bin/cova
          if-no-files-found: error

  macos-universal:
    name: macos-universal
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download per-architecture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cova-macos-*
          path: stage

      - name: Create universal binary
        # Staged outside dist/ so the raw binary is never published as an asset;
        # only the packaged artifacts are.
        run: |
          mkdir -p build/universal
          lipo -create \
            stage/cova-macos-x86_64/cova \
            stage/cova-macos-arm64/cova \
            -output build/universal/cova
          chmod +x build/universal/cova
          lipo -info build/universal/cova
          # lipo drops the signature, and Apple Silicon refuses unsigned
          # binaries, so re-apply an ad-hoc signature.
          codesign --force --sign - build/universal/cova
          codesign --verify --verbose build/universal/cova
          build/universal/cova --version

      - name: Build .pkg, .dmg and universal tarball
        env:
          COVA_BINARY: ${{ github.workspace }}/build/universal/cova
          COVA_PACKAGE_ARCH: universal
          COVA_PACKAGE_OS: macos
        run: bash scripts/package/build-all.sh

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos-universal
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x86_64 build with the UCRT64 MinGW-w64 GCC.
          - runner: windows-latest
            asset_arch: x86_64
            msystem: UCRT64
            compiler_package: mingw-w64-ucrt-x86_64-gcc
            python_package: mingw-w64-ucrt-x86_64-python
            ninja_package: mingw-w64-ucrt-x86_64-ninja
            cxx: g++
            ar: ar
            fresh_msys2: false
          # Native WoA build. CLANGARM64 is MSYS2's Arm64 environment; it ships
          # Clang rather than GCC, so the static link flags below are shared but
          # the driver and archiver are not.
          - runner: windows-11-arm
            asset_arch: arm64
            msystem: CLANGARM64
            compiler_package: mingw-w64-clang-aarch64-clang
            python_package: mingw-w64-clang-aarch64-python
            ninja_package: mingw-w64-clang-aarch64-ninja
            cxx: clang++
            ar: llvm-ar
            fresh_msys2: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install ${{ matrix.msystem }} toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # The Windows Arm64 image does not ship an Arm64 MSYS2 installation,
          # so the action installs the release from scratch there.
          release: ${{ matrix.fresh_msys2 }}
          update: true
          install: >-
            ${{ matrix.compiler_package }}
            ${{ matrix.python_package }}
            ${{ matrix.ninja_package }}

      - name: Install WiX
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $wixDir wix --version 5.0.2
          "COVA_WIX_DIR=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          & (Join-Path $wixDir "wix.exe") --version

      - name: Build
        env:
          COVA_CXX: ${{ matrix.cxx }}
          COVA_AR: ${{ matrix.ar }}
          COVA_CXXFLAGS: -O2 -DNDEBUG -static
          COVA_LDFLAGS: -static
        run: |
          $COVA_CXX --version | head -1
          python scripts/devbuild.py build -j "$(nproc)"

      - name: Test
        env:
          COVA_CXX: ${{ matrix.cxx }}
          COVA_AR: ${{ matrix.ar }}
          COVA_CXXFLAGS: -O2 -DNDEBUG -static
          COVA_LDFLAGS: -static
        run: python scripts/devbuild.py test -j "$(nproc)"

      - name: Check runtime dependencies
        # The MSI ships one file: cova.exe. A dynamically linked C++ runtime
        # would not be installed beside it, so fail instead of publishing a
        # binary that cannot start.
        run: |
          if command -v llvm-objdump >/dev/null 2>&1; then dump=llvm-objdump; else dump=objdump; fi
          deps="$("$dump" -p build/bin/cova.exe | sed -n 's/^[[:space:]]*DLL Name: //p')"
          echo "$deps"
          if printf '%s\n' "$deps" | grep -qiE '^(libstdc\+\+-6|libgcc_s_.+|libwinpthread-1|libc\+\+.*|libunwind.*|libssp-0)\.dll$'; then
            echo "::error::cova.exe links a C++ runtime DLL that the MSI does not install"
            exit 1
          fi

      - name: Build MSI
        run: |
          # The MSYS2 shell does not inherit the Windows PATH, so add the
          # directory chosen by the WiX install step explicitly.
          export PATH="$(cygpath -u "$COVA_WIX_DIR"):$PATH"
          wix --version
          bash scripts/package/build-msi.sh

      - name: Verify installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          if (-not $msi) { throw "the MSI build produced no installer" }
          $installDir = Join-Path $env:ProgramFiles "Cova"
          $log = Join-Path $env:RUNNER_TEMP "cova-msi.log"

          $install = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 120
            throw "MSI install failed with exit code $($install.ExitCode)"
          }

          $exe = Join-Path $installDir "cova.exe"
          if (-not (Test-Path $exe)) { throw "the MSI did not install cova.exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the installed cova.exe does not run" }

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (-not (($machinePath -split ';') -contains $installDir)) {
            throw "the MSI did not append $installDir to the system PATH"
          }

          $uninstall = Start-Process msiexec.exe -ArgumentList @("/x", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            Get-Content $log -Tail 120
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
          }
          if (Test-Path $exe) { throw "the uninstall left cova.exe behind" }
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (($machinePath -split ';') -contains $installDir) {
            throw "the uninstall left $installDir on the system PATH"
          }

      - name: Upload installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-log-${{ matrix.asset_arch }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [linux, macos-universal, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          # Per-job SHA256SUMS files are merged in too; drop them so the
          # published file describes only the installable artifacts.
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Cova $VERSION — beta.

          Cova is a cross-compilation-first build system, package manager and
          toolchain manager for C/C++, written in C++26. This is the first
          tagged beta: the manifest schema and the main CLI are expected to stay
          compatible from here, and any change to them gets called out in the
          release notes.

          ## Install

          One line, Linux or macOS:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/viloris-org/cova/main/install.sh | sh
          \`\`\`

          The script downloads the latest beta, verifies it against SHA256SUMS
          and installs to /usr/local/bin (or ~/.local/bin if that is not
          writable). Set COVA_VERSION to pin a version.

          ## Packages

          | Platform | Assets |
          |---|---|
          | Linux x86_64 / aarch64 | \`.deb\`, \`.rpm\`, pacman \`.pkg.tar.zst\`, \`.tar.gz\` |
          | macOS Intel + Apple Silicon | universal \`.pkg\`, \`.dmg\`, \`.tar.gz\` |
          | Windows x86_64 | \`.msi\` |
          | Windows Arm64 (WoA) | \`.msi\` |

          The Linux binaries are statically linked, so the same package works
          across distributions. The macOS binaries in the universal packages are
          signed ad-hoc, not with an Apple Developer ID: Gatekeeper asks for a
          one-time override, described in the README inside the image. The
          Windows x86_64 installer is built with MSYS2's UCRT64 GCC and the
          Arm64 installer with CLANGARM64 Clang. Both link the C++ runtime
          statically but use the system UCRT (present on Windows 10 and later).
          The MSIs are per-machine, add Cova to the system \`PATH\`, and are not
          code-signed. The portable Windows \`.zip\` from earlier betas is no
          longer published; use the MSI for the machine's architecture.

          On Windows, Cova builds projects with a MinGW-w64 toolchain (GCC or
          Clang) from MSYS2, winlibs or llvm-mingw. MSVC as a host toolchain is
          not supported yet.

          ## What works

          See [README.md](https://github.com/viloris-org/cova/blob/main/README.md#status)
          and [docs/MILESTONES.md](https://github.com/viloris-org/cova/blob/main/docs/MILESTONES.md).
          In short: project creation, the full manifest, target model, toolchain
          discovery/resolution, cross compilation, sysroots, managed toolchain
          install from a trusted local registry, incremental builds, local path
          dependencies, the lockfile, the compilation database, workspaces, and
          self-hosting.

          Remote dependency management and network component downloads are not
          implemented and fail explicitly rather than simulating a fetch.
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # The release job has no checkout, so GH_REPO names the repository
          # explicitly instead of relying on a git remote.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "Cova $VERSION" \
              --prerelease \
              --notes-file notes.md
          gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
